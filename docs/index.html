<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lift Log</title>
<meta name="theme-color" content="#181d24">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: one column, phone first; tabs pinned at the top, the open tab under them.
   Dark all the time, whatever the phone's setting (Kyle's call). */
:root{
  --bg:#181d24; --surface-2:#222932; --line:#2e3642;
  --ink:#e7ebf0; --ink-2:#adb6c3; --ink-3:#7f8998;
  --accent:#5aa2ff; --accent-ink:#0b1626; --accent-soft:#1c3552;
  --good:#62c690; --good-soft:#1b3326; --warn:#e8ab4f; --warn-soft:#382b15; --bad:#ec8a76;
  --s0:#1f4f80; --s1:#285c3e; --s2:#6e5b17;  /* history scale: low → mid → high */
  --display:"Barlow Condensed","Arial Narrow",sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:520px;margin-inline:auto;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:8px;display:grid;gap:6px;justify-items:center}
.screen{display:grid;gap:14px;align-content:start;padding-top:6px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .16)}
.sync{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.sync.bad{background:var(--surface-2);color:var(--bad)}
.empty{color:var(--ink-3);text-align:center;padding:40px 0}

/* weight tags */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;line-height:1.2}
.pill i{font-style:normal;font-size:9px}
.pill.ready{background:var(--good-soft);color:var(--good)}
.pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.long{background:var(--warn-soft);color:var(--warn)}

/* Exercise cards (Push / Pull / Legs) */
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:grid;gap:8px}
.row.done{background:var(--accent-soft);border-color:transparent}
.row-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.ex-name{font-weight:700;font-size:16px;min-width:0}
.row-ctl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.last{display:grid;gap:1px;min-width:0;line-height:1.2}
.last span{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.last b{font:600 17px/1.1 var(--display);color:var(--ink-2);font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:var(--surface-2);width:40px;height:44px;font-size:22px;line-height:1}
.stepper output{min-width:58px;text-align:center;font:700 23px/1 var(--display);font-variant-numeric:tabular-nums}
.stepper small{font:500 11px var(--body);color:var(--ink-3)}
.check{justify-self:end;border-radius:12px;height:44px;min-width:84px;padding:0 10px;font-weight:700;border:1.5px solid var(--accent);background:var(--bg);color:var(--accent)}
.check[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* Historical grid: fixed layout so it always fits the screen */
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.weeknav button{border:1px solid var(--line);background:var(--bg);width:42px;height:42px;border-radius:12px;font-size:18px}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav b{font:700 22px/1 var(--display);text-align:center}
table.grid{border-collapse:separate;border-spacing:2px;table-layout:fixed;width:100%;font-variant-numeric:tabular-nums}
.grid col.nmcol{width:29%}
.grid th,.grid td{padding:0;text-align:center;font-size:11px}
.grid thead th{color:var(--ink-3);font-weight:600;padding-bottom:4px;line-height:1.15;vertical-align:bottom}
.grid thead th .d{display:block;font:700 15px var(--display);color:var(--ink-2)}
.grid th.nm{text-align:left;font-weight:600;font-size:12.5px;color:var(--ink);line-height:1.15;padding-right:4px;overflow-wrap:anywhere}
.grid tr.grp th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:10px 0 2px;font-weight:600}
.grid td.c{height:32px;border-radius:7px;font:600 14px/1 var(--display);white-space:nowrap;overflow:hidden}
.grid td.c.plain{background:var(--surface-2);color:var(--ink-2)}

/* date control above the exercise tabs: ‹ label › ; the label opens the phone's date picker */
.datebar{display:flex;align-items:center;justify-content:center;gap:6px}
.datebar > button{border:0;background:none;width:40px;height:36px;border-radius:10px;font-size:20px;color:var(--ink-2)}
.datebar > button:disabled{opacity:.3;cursor:default}
.datepick{position:relative;min-width:150px;text-align:center;font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px;color:var(--ink-2)}
.datepick.past{background:var(--warn-soft);color:var(--warn)}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;cursor:pointer}

.tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 4px 14px rgb(0 0 0 / .2)}
</style>
</head>
<body>
<div class="app">
  <div class="top" id="top"></div>
  <div class="screen" id="screen"></div>
</div>
<div class="tip" id="tip" hidden></div>

<script>
/* The log lives in a Google Sheet behind an Apps Script web app (apps-script/
   in the repo). This page keeps a copy in localStorage so it opens instantly and
   works offline; changes queue up and are sent when there is a connection. */
const API = "https://script.google.com/macros/s/AKfycbw07XGcy6bStN_AnhQnrdrngdMappvgGmJ7lSxQxsvEJrMaX59-yOGjmqc3J5jZ4eJIlw/exec";

/* ---------- storage ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let DATA = store.get("liftlog:data", null);        // {exercises, log} as the server last sent it, plus local changes
let PENDING = store.get("liftlog:pending", []);    // [{op, id, date, amount}] not yet acknowledged
let syncState = "ok";                              // ok, offline or error

/* ---------- dates (local, as yyyy-mm-dd) ---------- */
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const WEEKDAY = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const mondayOf = s => addDays(s, -((parse(s).getDay() + 6) % 7));
const fmt = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());

/* ---------- the model, rebuilt from DATA on each render ---------- */
let M;
function model() {
  const ex = DATA.exercises, byId = Object.fromEntries(ex.map(e => [e.id, e])), byEx = {};
  // oldest first; on the same day a week-only import row sorts before a dated one
  const log = DATA.log.filter(e => byId[e.id]).map(e => ({ ...e, day:e.date || e.week, weekOnly:!e.date }))
    .sort((a, b) => a.day.localeCompare(b.day) || b.weekOnly - a.weekOnly);
  log.forEach(e => (byEx[e.id] ||= []).push(e));
  M = { ex, byId, groups:[...new Set(ex.map(e => e.group))], byEx, first:mondayOf(log[0]?.day || today()) };
}
const hist = id => M.byEx[id] || [];
const inGroup = g => M.ex.filter(e => e.group === g);
const entryOn = (id, d) => hist(id).find(e => e.date === d);
// the most recent entry before day d (a week-only import row counts from its Monday)
const lastBefore = (id, d) => hist(id).filter(e => e.day <= d && e.date !== d).at(-1) || null;

/* ---------- amounts ---------- */
const unit = e => e.kind === "reps" ? "reps" : "lb";
const draft = {};                                                  // "id|day" -> − / + before ✓
const amountOn = (e, d) => entryOn(e.id, d)?.amount ?? draft[e.id + "|" + d] ?? lastBefore(e.id, d)?.amount ?? (e.kind === "reps" ? 10 : 0);

/* ---------- the tag on a card ----------
   "Ready for #" counts sessions at the current amount. How many it takes depends
   on how big one step is for this exercise: 7.5% or less needs 2, up to 15%
   needs 3, bigger needs 4. Eight or more turns it yellow. "New weight" shows for
   up to 2 sessions after moving up. Otherwise no tag. */
const need = (w, step) => { const jump = w > 0 ? step / w : 1; return jump <= 0.075 ? 2 : jump <= 0.15 ? 3 : 4; };
function pill(e) {
  const h = hist(e.id);
  if (!h.length) return "";
  const w = h.at(-1).amount;
  let i = h.length - 1; while (i >= 0 && h[i].amount === w) i--;   // h[i] = the last different amount
  const at = h.length - 1 - i;
  if (at >= need(w, e.step)) return `<span class="pill ${at >= 8 ? "long" : "ready"}"><i>▲</i>Ready for ${w + e.step}</span>`;
  if (i >= 0 && h[i].amount < w && at <= 2) return `<span class="pill new"><i>●</i>${e.kind === "reps" ? "More reps" : "New weight"}</span>`;
  return "";
}

/* ---------- changes and sync ---------- */
function applyLocal(op) {
  const i = DATA.log.findIndex(e => e.id === op.id && e.date === op.date);
  if (op.op === "del") { if (i >= 0) DATA.log.splice(i, 1); }
  else if (i >= 0) DATA.log[i].amount = op.amount;
  else DATA.log.push({ id:op.id, date:op.date, week:mondayOf(op.date), amount:op.amount });
}
function change(op) {
  PENDING = PENDING.filter(p => !(p.id === op.id && p.date === op.date));   // one op per exercise and day
  PENDING.push(op);
  applyLocal(op);
  store.set("liftlog:pending", PENDING); store.set("liftlog:data", DATA);
  render(); clearTimeout(change.t); change.t = setTimeout(sync, 700);
}
let busy = false;
async function sync() {
  if (busy) return;
  busy = true;
  const sent = PENDING.slice();
  try {
    const r = sent.length
      ? await fetch(API, { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ ops:sent }) })
      : await fetch(API + "?t=" + Date.now());
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || "not ok");
    PENDING = PENDING.filter(p => !sent.includes(p));   // anything changed meanwhile stays queued
    store.set("liftlog:pending", PENDING);
    DATA = { exercises:j.exercises, log:j.log };
    PENDING.forEach(applyLocal);
    store.set("liftlog:data", DATA);
    syncState = "ok";
  } catch (err) {
    syncState = navigator.onLine ? "error" : "offline";
  }
  busy = false;
  render();
  if (PENDING.length && syncState === "ok") sync();
}
["online", "focus", "pageshow"].forEach(ev => addEventListener(ev, sync));
document.addEventListener("visibilitychange", () => { if (!document.hidden) sync(); });
setInterval(() => { if (!document.hidden) sync(); }, 120000);

/* ---------- tabs: one per group (Push, Pull, Legs), then Historical ----------
   Opens on the group last used today, else the first (Push). */
function todayGroup() {
  const saved = store.get("liftlog:group", null);
  return saved && saved.date === today() && M.groups.includes(saved.group) ? saved.group : M.groups[0];
}
const ui = { tab:null, hpage:0, day:null };   // tab: a group name or "hist"; day: a past date, null = today
const logDay = () => ui.day && ui.day < today() ? ui.day : today();
const setDay = d => { ui.day = d < today() ? d : null; };
const tabList = () => [...M.groups, "hist"];
const currentTab = () => (ui.tab = tabList().includes(ui.tab) ? ui.tab : todayGroup());
function go(tab) {
  ui.tab = tab;
  if (tab !== "hist") store.set("liftlog:group", { date:today(), group:tab });
  scrollTo(0, 0); render();
}

/* ---------- views ---------- */
const tabs = cur => `<div class="seg" role="group">${tabList().map(t => `<button data-act="tab" data-v="${t}" aria-pressed="${t === cur}">${t === "hist" ? "Historical" : t}</button>`).join("")}</div>`;

// ‹ label › for the day being logged; the label is a transparent date input
function dateBar() {
  const d = logDay(), n = daysBetween(d, today());
  const label = `${n === 0 ? "Today" : n === 1 ? "Yesterday" : WEEKDAY[parse(d).getDay()].slice(0, 3)} · ${fmt(d)}`;
  return `<div class="datebar"><button data-act="day" data-v="-1" aria-label="Previous day">‹</button>
    <label class="datepick${n ? " past" : ""}">${label}<input type="date" id="logday" value="${d}" max="${today()}" aria-label="Day to log"></label>
    <button data-act="day" data-v="1" aria-label="Next day" ${n ? "" : "disabled"}>›</button></div>`;
}

// Today / Yesterday / the weekday name for the last 6 days / "9 days ago".
// Week-only import rows have no day: this week's count as that Monday, older
// ones say "Last week" / "3 weeks ago".
function ago(e) {
  const d = e.weekOnly && e.week === mondayOf(today()) ? e.week : e.date;
  if (!d) {
    const n = Math.round(daysBetween(e.week, mondayOf(today())) / 7);
    return n === 1 ? "Last week" : `${n} weeks ago`;
  }
  const n = daysBetween(d, today());
  return n === 0 ? "Today" : n === 1 ? "Yesterday" : n < 7 ? WEEKDAY[parse(d).getDay()] : `${n} days ago`;
}

// A group's cards: name and tag on top; below, when it was last done over what
// it was (left), − / + for the day being logged (middle), and ✓ (right).
function vGroup(group) {
  const d = logDay();
  return `<ol class="checklist">${inGroup(group).map(e => {
    const t = entryOn(e.id, d), l = lastBefore(e.id, d);
    const last = l ? `<span>${ago(l)}</span><b>${l.amount} ${unit(e)}</b>` : `<span>First time</span><b>–</b>`;
    return `<li class="row ${t ? "done" : ""}">
      <div class="row-top"><span class="ex-name">${e.name}</span>${pill(e)}</div>
      <div class="row-ctl"><div class="last">${last}</div>
        <div class="stepper"><button data-act="minus" data-id="${e.id}" aria-label="Less">−</button><output>${amountOn(e, d)}<small> ${unit(e)}</small></output><button data-act="plus" data-id="${e.id}" aria-label="More">+</button></div>
        <button class="check" data-act="check" data-id="${e.id}" aria-pressed="${!!t}">${t ? "✓ Done" : e.kind === "weight" ? "✓ 3×10" : "✓ 3 sets"}</button></div></li>`;
  }).join("")}</ol>`;
}

/* Historical: 8 weeks per page; each weight row colored low (blue) → green →
   high (yellow) against that exercise's whole history, so a week keeps its color
   while paging. */
const heat = t => t <= 0.5
  ? `color-mix(in oklab, var(--s1) ${Math.round(t * 200)}%, var(--s0))`
  : `color-mix(in oklab, var(--s2) ${Math.round((t - 0.5) * 200)}%, var(--s1))`;
function vHist() {
  const newest = addDays(mondayOf(today()), -56 * ui.hpage);
  const wk = Array.from({ length:8 }, (_, i) => addDays(newest, -7 * (7 - i)));
  const head = `<tr><th></th>${wk.map((w, i) => { const d = parse(w); return `<th>${i === 0 || d.getDate() <= 7 ? MON[d.getMonth()] : "&nbsp;"}<span class="d">${d.getDate()}</span></th>`; }).join("")}</tr>`;
  const rows = M.groups.map(g => `<tr class="grp"><th colspan="9">${g}</th></tr>` + inGroup(g).map(e => {
    const h = hist(e.id), vals = h.map(x => x.amount), lo = Math.min(...vals), hi = Math.max(...vals);
    const cells = wk.map(w => {
      const en = h.filter(x => x.week === w).at(-1);
      if (!en) return `<td class="c"></td>`;
      const tip = `${e.name}, week of ${fmt(w)}: ${en.amount} ${unit(e)}`;
      if (e.kind === "reps") return `<td class="c plain" data-tip="${tip}">${en.amount}</td>`;   // reps: no color scale
      const t = hi > lo ? (en.amount - lo) / (hi - lo) : 0.5;
      return `<td class="c" style="background:${heat(t)}" data-tip="${tip}">${en.amount}</td>`;
    }).join("");
    return `<tr><th class="nm">${e.short || e.name}</th>${cells}</tr>`;
  }).join("")).join("");
  return `<div class="weeknav"><button data-act="hp" data-v="-1" aria-label="Earlier" ${wk[0] > M.first ? "" : "disabled"}>‹</button>
    <b>${fmt(wk[0])} – ${fmt(addDays(wk[7], 6))}</b><button data-act="hp" data-v="1" aria-label="Later" ${ui.hpage > 0 ? "" : "disabled"}>›</button></div>
    <table class="grid"><colgroup><col class="nmcol">${"<col>".repeat(8)}</colgroup><thead>${head}</thead><tbody>${rows}</tbody></table>`;
}

const $top = document.getElementById("top"), $screen = document.getElementById("screen");
function render() {
  hideTip();
  const waiting = PENDING.length ? ` · ${PENDING.length} to save` : "";
  const badge = syncState === "offline" ? `<span class="sync">Offline${waiting}</span>`
    : syncState === "error" ? `<span class="sync bad">Couldn't reach the Sheet${waiting}</span>` : "";
  if (!DATA) {
    $top.innerHTML = badge;
    $screen.innerHTML = `<p class="empty">${syncState === "ok" ? "Loading your log…" : "Couldn't load your log. Check your connection."}</p>`;
    return;
  }
  model();
  const tab = currentTab();
  $top.innerHTML = tabs(tab) + (tab === "hist" ? "" : dateBar()) + badge;
  $screen.innerHTML = tab === "hist" ? vHist() : vGroup(tab);
}

document.addEventListener("change", ev => {
  if (ev.target.id === "logday") { setDay(ev.target.value); render(); }
});

/* swipe sideways for the next / previous tab: a quick stroke, mostly across */
let touch = null;
document.addEventListener("touchstart", ev => {
  touch = ev.touches.length === 1 ? { x:ev.touches[0].clientX, y:ev.touches[0].clientY, t:Date.now() } : null;
}, { passive:true });
document.addEventListener("touchend", ev => {
  if (!touch || !DATA) return;
  const p = ev.changedTouches[0], dx = p.clientX - touch.x, dy = p.clientY - touch.y, quick = Date.now() - touch.t < 700;
  touch = null;
  if (!quick || Math.abs(dx) < 60 || Math.abs(dx) < 2 * Math.abs(dy)) return;
  const list = tabList(), next = list[list.indexOf(currentTab()) + (dx < 0 ? 1 : -1)];
  if (next) go(next);
}, { passive:true });

document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el) return;
  const { act, id, v } = el.dataset, e = M.byId[id], d = logDay();
  switch (act) {
    case "tab": return go(v);
    case "hp": ui.hpage = Math.max(0, ui.hpage - +v); break;
    case "day": setDay(addDays(d, +v)); break;
    case "minus": case "plus": {
      const n = Math.max(0, amountOn(e, d) + (act === "plus" ? e.step : -e.step));
      draft[id + "|" + d] = n;
      if (entryOn(id, d)) return change({ op:"set", id, date:d, amount:n });
      break;
    }
    case "check":
      return change(entryOn(id, d) ? { op:"del", id, date:d } : { op:"set", id, date:d, amount:amountOn(e, d) });
  }
  render();
});

/* tooltip on Historical cells: hover on desktop, tap on phone */
const tip = document.getElementById("tip");
function hideTip() { tip.hidden = true; }
function tipAt(ev) {
  const el = ev.target.closest("[data-tip]");
  if (!el) return hideTip();
  tip.textContent = el.dataset.tip; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, ev.clientX - r.width / 2)) + "px";
  tip.style.top = Math.max(8, ev.clientY - r.height - 12) + "px";
}
document.addEventListener("pointermove", ev => { if (ev.pointerType === "mouse") tipAt(ev); });
document.addEventListener("pointerdown", ev => { if (ev.pointerType !== "mouse") tipAt(ev); });
addEventListener("scroll", hideTip, { passive:true });

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
render();
sync();
</script>
</body>
</html>
